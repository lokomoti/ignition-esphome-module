name: Release MODL
on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Use tag as module version
        id: version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "value=$TAG_NAME" >> "$GITHUB_OUTPUT"
      - name: Build MODL
        run: mvn -B -ntp -Drevision=${{ steps.version.outputs.value }} package
      - name: Verify artifact exists
        shell: bash
        run: |
          shopt -s nullglob
          files=(esphome-device-build/target/*.modl)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .modl artifact found in esphome-device-build/target/"
            exit 1
          fi
          echo "Found artifacts: ${files[*]}"
      - name: Create GitHub Release and upload MODL
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: esphome-device-build/target/*.modl
